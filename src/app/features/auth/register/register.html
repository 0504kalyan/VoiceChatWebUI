<div class="auth-page">
  <div class="card">
    <h1>Create account</h1>
    <p class="hint">Register with Gmail: we email a code, then you choose a password.</p>

    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }

    @if (step() === 1) {
      <label class="field">
        <span>Gmail address</span>
        <input type="email" [(ngModel)]="email" name="email" autocomplete="email" placeholder="you@gmail.com" />
      </label>
      <div class="actions">
        <button type="button" class="btn primary" [disabled]="busy() || !email.trim()" (click)="sendOtp()">
          Send verification code
        </button>
      </div>
      <button type="button" class="btn google" [disabled]="busy()" (click)="google()">Continue with Google</button>
    } @else if (step() === 2) {
      <p class="sent">Code sent to <strong>{{ email }}</strong></p>
      <label class="field">
        <span>6-digit code</span>
        <input type="text" inputmode="numeric" maxlength="6" [(ngModel)]="code" name="code" autocomplete="one-time-code" />
      </label>
      <div class="actions">
        <button type="button" class="btn ghost" [disabled]="busy()" (click)="step.set(1)">Back</button>
        <button
          type="button"
          class="btn primary"
          [disabled]="busy() || code.trim().length < 6"
          (click)="validateOtp()"
        >
          Validate OTP
        </button>
      </div>
    } @else {
      <p class="sent">OTP validated for <strong>{{ email }}</strong></p>
      <app-password-field
        label="Password"
        name="password"
        autocomplete="new-password"
        [showRequirements]="true"
        [(value)]="password"
      />
      <app-password-field
        label="Confirm password"
        name="confirm"
        autocomplete="new-password"
        [(value)]="confirmPassword"
      />
      <div class="actions">
        <button type="button" class="btn ghost" [disabled]="busy()" (click)="step.set(2)">Back</button>
        <button
          type="button"
          class="btn primary"
          [disabled]="busy() || !passwordOk()"
          (click)="complete()"
        >
          Create account
        </button>
      </div>
    }

    <p class="footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
