<div class="auth-page">
  <div class="card">
    <h1>Set new password</h1>
    <p class="hint">Choose a new password for <strong>{{ email || 'your account' }}</strong>.</p>

    @if (missingLink()) {
      <div class="alert">This page needs a valid reset link from your email (token and email in the URL).</div>
    }
    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }
    @if (success()) {
      <div class="success-msg">{{ success() }}</div>
      <p class="footer"><a routerLink="/login" class="text-link">Sign in</a></p>
    } @else {
      <app-password-field
        label="New password"
        name="password"
        autocomplete="new-password"
        [showRequirements]="true"
        [(value)]="password"
      />
      <app-password-field
        label="Confirm password"
        name="confirm"
        autocomplete="new-password"
        [(value)]="confirmPassword"
      />
      <div class="actions">
        <a routerLink="/login" class="text-link">Back to sign in</a>
        <button
          type="button"
          class="btn primary"
          [disabled]="busy() || missingLink() || !passwordOk()"
          (click)="submit()"
        >
          Update password
        </button>
      </div>
    }
  </div>
</div>
