<div class="auth-page">
  <div class="card">
    <div class="brand-mark">
      <img src="chat-brand.png" alt="ChatAI" />
    </div>
    <h1>Forgot password</h1>
    <p class="hint">Enter your Gmail. If an account exists with a password, we will send a reset link.</p>

    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }
    @if (success()) {
      <div class="success-msg">{{ success() }}</div>
    }

    <label class="field">
      <span>Gmail address</span>
      <input type="email" [(ngModel)]="email" name="email" autocomplete="email" placeholder="you@gmail.com" />
    </label>
    <div class="actions">
      <button type="button" class="btn primary" [disabled]="busy() || !email.trim() || success()" (click)="submit()">
        Send reset link
      </button>
    </div>

    <p class="footer footer-centered">
      <a routerLink="/login">Back to sign in</a>
    </p>
    <p class="footer footer-centered footer-compact">
      No account? <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
